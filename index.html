<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Receber</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#1d4ed8;--red:#dc2626;--ok:#16a34a;--warn:#d97706;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mut:#9aa3af;--pri:#60a5fa;--red:#f87171;--ok:#4ade80;--warn:#fbbf24;--bd:#2b323a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:0 0 12px}
.sum{background:var(--pri);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.sum small{opacity:.9}.sum b{display:block;font-size:30px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:13px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.item{display:flex;gap:12px;cursor:pointer;align-items:center}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.grow{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:13px}.red{color:var(--red);font-weight:700}.ok{color:var(--ok);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px;color:#fff}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:6px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:600;box-shadow:0 4px 14px #0004}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%}
button.w{background:#16a34a;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%;margin-top:8px}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:14px}
button.d{background:transparent;color:var(--red);border:0;font-size:13px;padding:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px;font-family:inherit}
label{font-size:13px;color:var(--mut)}
.big{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.pay{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.back{background:none;border:0;color:var(--pri);font-size:16px;padding:0 0 10px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.pick{display:block;border:2px dashed var(--bd);border-radius:12px;padding:12px;text-align:center;color:var(--mut);margin-bottom:10px;cursor:pointer}
.pick img{max-width:100%;max-height:160px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY='receber_v1';
const ST=['Aguardando pagamento','Em andamento','Pronto p/ retirar','Entregue'];
const COR=['#d97706','#2563eb','#7c3aed','#16a34a'];
let db=[];try{db=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){db=[]}
let view={p:'list',id:null},tab='rec',tmpPhoto='';
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Memória cheia. Faça backup e apague itens antigos.')}};
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
const paid=p=>p.pays.reduce((s,x)=>s+x.v,0);
const rest=p=>Math.max(0,p.total-paid(p));
const dt=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const tag=p=>`<span class="tag" style="background:${COR[p.st]}">${ST[p.st]}</span>`;

function resize(file,cb){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=e.target.result};r.readAsDataURL(file)}

function render(){const a=$('#app');
 if(view.p==='list')return list(a);
 if(view.p==='new')return form(a);
 detail(a)}

function list(a){
 const tot=db.reduce((s,p)=>s+rest(p),0),rec=db.reduce((s,p)=>s+paid(p),0);
 let h=`<h1>💰 A Receber</h1><div class="sum"><small>Total que clientes ainda me devem</small><b>${brl(tot)}</b><small>Já recebido: ${brl(rec)}</small></div>
 <div class="tabs"><button class="${tab==='rec'?'on':''}" onclick="setTab('rec')">A receber</button><button class="${tab==='ent'?'on':''}" onclick="setTab('ent')">Entregues</button><button class="${tab==='all'?'on':''}" onclick="setTab('all')">Todos</button></div>`;
 let L=db.filter(p=>tab==='all'||(tab==='rec'?!(p.st===3&&rest(p)===0):(p.st===3&&rest(p)===0)));
 L.sort((x,y)=>rest(y)-rest(x));
 if(!L.length)h+='<div class="empty">Nada por aqui.<br>Toque em <b>+ Novo orçamento</b>.</div>';
 L.forEach(p=>{const r=rest(p),pc=p.total?Math.min(100,paid(p)/p.total*100):0;
  h+=`<div class="card item" onclick="go('d','${p.id}')">${p.photo?`<img class="th" src="${p.photo}">`:'<div class="th">🔧</div>'}
  <div class="grow"><div class="nm">${esc(p.cli)}</div><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.serv)}</div>${tag(p)}
  <div class="bar"><i style="width:${pc}%"></i></div><div class="mut">Orçado ${brl(p.total)} · recebido ${brl(paid(p))}</div></div>
  <div style="text-align:right">${r>0?`<div class="red">${brl(r)}</div><div class="mut">falta</div>`:'<div class="ok">Pago ✓</div>'}</div></div>`});
 h+=`<button class="fab" onclick="go('new')">+ Novo orçamento</button>
 <div class="row" style="margin-top:20px"><button class="g" onclick="exp()">⬇ Backup</button><button class="g" onclick="$('#imp').click()">⬆ Restaurar</button></div>
 <input type="file" id="imp" accept=".json" hidden onchange="imp(this)">`;
 a.innerHTML=h}

function setTab(t){tab=t;render()}

function form(a){
 a.innerHTML=`<button class="back" onclick="go('list')">← Voltar</button><h1>Novo orçamento</h1>
 <label>Cliente</label><input id="c" placeholder="Nome do cliente">
 <label>WhatsApp (com DDD)</label><input id="tel" inputmode="tel" placeholder="75 99999-9999">
 <label>Serviço / equipamento</label><input id="s" placeholder="Ex: Notebook Dell - troca de tela">
 <label>Valor do orçamento (R$)</label><input id="t" inputmode="decimal" placeholder="490">
 <label>Entrada recebida (R$) — vazio se não pagou</label><input id="e" inputmode="decimal" placeholder="200">
 <label>Situação</label><select id="st">${ST.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select>
 <label>Observação</label><textarea id="o" rows="2" placeholder="Ex: só faz depois de pagar o restante"></textarea>
 <label class="pick" id="pk">📷 Foto do equipamento (opcional)<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label>
 <button class="b" onclick="addItem()">Salvar</button>`;
 tmpPhoto=''}

function pickPhoto(i){if(!i.files[0])return;resize(i.files[0],u=>{tmpPhoto=u;$('#pk').innerHTML=`<img src="${u}">`})}

function addItem(){
 const cli=$('#c').value.trim(),total=num($('#t').value),e=num($('#e').value);
 if(!cli||total<=0)return alert('Informe o cliente e o valor do orçamento.');
 const p={id:Date.now().toString(36),cli,tel:$('#tel').value.replace(/\D/g,''),serv:$('#s').value.trim(),total,obs:$('#o').value.trim(),st:+$('#st').value,photo:tmpPhoto,date:today(),pays:[]};
 if(e>0)p.pays.push({id:'e'+Date.now(),v:Math.min(e,total),d:today(),note:'Entrada'});
 db.push(p);save();go('d',p.id)}

function detail(a){
 const p=db.find(x=>x.id===view.id);if(!p)return go('list');
 const r=rest(p);
 let h=`<button class="back" onclick="go('list')">← Voltar</button>
 ${p.photo?`<img class="big" src="${p.photo}">`:''}
 <h1>${esc(p.cli)}</h1><div class="mut" style="margin-bottom:10px">${esc(p.serv)}</div>
 <div class="card"><div class="row"><div><div class="mut">Orçado</div><b>${brl(p.total)}</b></div><div><div class="mut">Recebido</div><b>${brl(paid(p))}</b></div><div><div class="mut">Falta</div><span class="${r>0?'red':'ok'}">${r>0?brl(r):'Pago ✓'}</span></div></div>
 ${p.obs?`<div class="mut" style="margin-top:10px">📝 ${esc(p.obs)}</div>`:''}</div>
 <div class="card"><label>Situação do serviço</label><select onchange="setSt('${p.id}',this.value)">${ST.map((s,i)=>`<option value="${i}" ${p.st===i?'selected':''}>${s}</option>`).join('')}</select>
 ${p.tel&&r>0?`<button class="w" onclick="cobrar('${p.id}')">💬 Cobrar no WhatsApp</button>`:''}</div>`;
 if(r>0)h+=`<div class="card"><label>Registrar pagamento recebido (R$)</label><input id="pv" inputmode="decimal" placeholder="Quanto o cliente pagou?">
 <label>Data</label><input id="pd" type="date" value="${today()}"><button class="b" onclick="addPay('${p.id}')">Abater do orçamento</button></div>`;
 h+=`<div class="card"><b>Pagamentos recebidos</b>`;
 if(!p.pays.length)h+='<div class="mut" style="padding:8px 0">Nenhum pagamento ainda.</div>';
 [...p.pays].reverse().forEach(x=>{h+=`<div class="pay"><div><div class="ok">${brl(x.v)}</div><div class="mut">${dt(x.d)}${x.note?' · '+x.note:''}</div></div><button class="d" onclick="delPay('${p.id}','${x.id}')">apagar</button></div>`});
 h+=`</div><div class="mut" style="margin-bottom:10px">Orçamento de ${dt(p.date)}</div><button class="d" onclick="delP('${p.id}')">🗑 Excluir este orçamento</button>`;
 a.innerHTML=h}

function setSt(id,v){db.find(x=>x.id===id).st=+v;save();render()}
function addPay(id){const p=db.find(x=>x.id===id),v=num($('#pv').value);
 if(v<=0)return alert('Informe o valor.');
 p.pays.push({id:'p'+Date.now(),v:Math.min(v,rest(p)),d:$('#pd').value||today(),note:''});
 if(rest(p)===0&&p.st===0)p.st=1;
 save();render()}
function delPay(id,pid){if(!confirm('Apagar este pagamento?'))return;const p=db.find(x=>x.id===id);p.pays=p.pays.filter(x=>x.id!==pid);save();render()}
function delP(id){if(!confirm('Excluir o orçamento inteiro?'))return;db=db.filter(x=>x.id!==id);save();go('list')}
function cobrar(id){const p=db.find(x=>x.id===id);
 const m=`Olá ${p.cli}, tudo bem? Sobre o serviço "${p.serv||'seu serviço'}": o valor é ${brl(p.total)}, já recebi ${brl(paid(p))} e falta ${brl(rest(p))}. Assim que acertar, continuo com o serviço. Obrigado!`;
 const n=p.tel.length<=11?'55'+p.tel:p.tel;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
function go(p,id){view={p,id:id||null};render();window.scrollTo(0,0)}
function exp(){const b=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='receber-backup.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{db=JSON.parse(e.target.result);save();render()}catch(x){alert('Arquivo inválido')}};r.readAsText(f)}
render();
</script>
</body>
</html>
